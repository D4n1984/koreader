name: Android APK Build

on:
  push:
    branches:
      - widget
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git describe

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bash cmake coreutils curl diffutils \
            findutils g++ gcc gettext-dev git grep gzip libtool \
            linux-headers make meson nasm ninja-build patch perl \
            pkgconf unzip wget p7zip-full openjdk-17-jdk-headless

      - name: Build Android APK (ARM)
        run: |
          # KoReader will automatically download NDK and SDK if not present
          ./kodev release android-arm
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: koreader-android-arm-apk
          path: |
            koreader-android-*-arm.apk
            koreader-android-*-arm64.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: koreader-android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
